name: Secure DB Backup to R2

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Tools
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y default-mysql-client rclone >/dev/null 2>&1

      - name: Configure R2
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      # ---------------------------------------------------------
      # 1. Dump STRUCTURE (no data)
      # ---------------------------------------------------------
      - name: Dump Structure
        run: |
          set -o pipefail
          set +x

          mysqldump \
            --no-data \
            --skip-comments \
            --set-gtid-purged=OFF \
            --default-character-set=utf8mb4 \
            --column-statistics=0 \
            --no-tablespaces \
            --skip-triggers \
            --skip-routines \
            --skip-events \
            --compact \
            -h${{ secrets.DB_HOST }} -P${{ secrets.DB_PORT }} \
            -u${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" \
            ${{ secrets.DB_DATA }} \
            > structure_raw.sql 2>/dev/null

          if [ $? -ne 0 ]; then echo "Error"; exit 1; fi

      # ---------------------------------------------------------
      # 2. Normalize STRUCTURE（处理排序规则 / 字符集）
      # ---------------------------------------------------------
      - name: Normalize Structure
        run: |
          cp structure_raw.sql structure_clean.sql

          # 直接把 MySQL 8 专用排序规则换成兼容的
          sed -i 's/utf8mb4_0900_ai_ci/utf8mb4_general_ci/g' structure_clean.sql
          sed -i 's/utf8mb4_0900_bin/utf8mb4_general_ci/g' structure_clean.sql

          # 避免 utf8mb3，统一成 utf8mb4
          sed -i 's/utf8mb3/utf8mb4/g' structure_clean.sql

          # 压缩结构文件，单独保留一个小包
          cp structure_clean.sql structure_only.sql
          gzip structure_only.sql

      # ---------------------------------------------------------
      # 3. Dump DATA（保留你原来的所有参数）
      # ---------------------------------------------------------
      - name: Dump Data
        run: |
          set -o pipefail
          set +x

          mysqldump \
            --no-create-info \
            --single-transaction \
            --quick \
            --skip-extended-insert \
            --complete-insert \
            --set-gtid-purged=OFF \
            --default-character-set=utf8mb4 \
            --column-statistics=0 \
            --ssl-mode=DISABLED \
            -h${{ secrets.DB_HOST }} -P${{ secrets.DB_PORT }} \
            -u${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" \
            ${{ secrets.DB_DATA }} \
            > data.sql 2>/dev/null

          if [ $? -ne 0 ]; then echo "Error"; exit 1; fi

      # ---------------------------------------------------------
      # 4. Merge STRUCTURE + DATA → full_backup.sql
      #   （顺手再保险：再跑一遍排序规则替换）
      # ---------------------------------------------------------
      - name: Merge SQL Files
        run: |
          cat structure_clean.sql data.sql > full_backup.sql


          gzip full_backup.sql

          FILE_SIZE=$(stat -c%s full_backup.sql.gz)
          if [ "$FILE_SIZE" -lt 10240 ]; then echo "Error"; exit 1; fi

      # ---------------------------------------------------------
      # 5. Upload to R2（两个压缩包：结构 + 全量）
      # ---------------------------------------------------------
      - name: Upload to R2
        run: |
          set +x
          rclone copy structure_only.sql.gz r2:${{ secrets.R2_BUCKET }}/db-backups \
            --s3-no-check-bucket --checksum -q >/dev/null 2>&1

          if [ $? -ne 0 ]; then echo "Error"; exit 1; fi

          rclone copy full_backup.sql.gz r2:${{ secrets.R2_BUCKET }}/db-backups \
            --s3-no-check-bucket --checksum -q >/dev/null 2>&1

          if [ $? -ne 0 ]; then echo "Error"; exit 1; fi

          echo "Success"

      # ---------------------------------------------------------
      # 6. Cleanup（只清本地，不动 R2）
      # ---------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.config/rclone >/dev/null 2>&1
          rm -f structure_raw.sql structure_clean.sql data.sql >/dev/null 2>&1
          rm -f full_backup.sql.gz structure_only.sql.gz >/dev/null 2>&1

      # ---------------------------------------------------------
      # 7. Keepalive commit
      # ---------------------------------------------------------
      - name: Create keep-alive commit
        run: |
          echo "Last backup: $(date -u '+%Y-%m-%d %H:%M:%S UTC') | ID: $(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 8)" > keepalive.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.md || true

      - name: Commit & Push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "keepalive"
          file_pattern: keepalive.md
          push_options: '--force'
